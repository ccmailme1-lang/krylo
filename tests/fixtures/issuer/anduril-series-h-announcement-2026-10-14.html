    <script type="application/json" id="ssgContent">
        {"_createdAt":"2026-05-12T17:48:24Z","_id":"c9da5725-b0db-46ab-a462-d85e3bb3a24a","_rev":"w7G8R7I4wAezC2nvnFnQ9Y","_system":{"base":{"id":"drafts.c9da5725-b0db-46ab-a462-d85e3bb3a24a","rev":"2a480967-06ca-45c2-a5db-00aad205cfb6"}},"_type":"article","_updatedAt":"2026-05-13T12:58:31Z","authors":[{"_createdAt":"2025-04-10T02:38:50Z","_id":"1e8357b7-66a6-46c2-9dab-032bfee81bcc","_rev":"vF70CHcCgVKNA9cU1sRvhW","_system":{"base":{"id":"1e8357b7-66a6-46c2-9dab-032bfee81bcc","rev":"xkp7TRHt1f3meW5z5V4kVK"}},"_type":"person","_updatedAt":"2025-11-18T17:34:39Z","bio":[{"_key":"dea7c34ef13c","_type":"block","children":[{"_key":"bce8f78f35200","_type":"span","marks":[],"text":"Prior to Anduril, Brian was an early hire at Palantir Technologies, where he built the Foundry product that is now deployed worldwide, and led the engineering and product organizations as Director of Engineering. He served numerous domestic and international government organizations across the intelligence, defense, and law enforcement sectors."}],"markDefs":[],"style":"normal"},{"_key":"fe0584ce591f","_type":"block","children":[{"_key":"1fff867709b1","_type":"span","marks":[],"text":"Previously, Brian was the Founder and Lead of Cornell University’s autonomous vehicle research program where his teams competed in the DARPA Grand Challenge and Urban Challenge. Based on this work, he published several technical papers on autonomous vehicles. Brian graduated from Cornell University with a Bachelor of Science in Operations Research and Industrial Engineering. He also serves as a senior advisor and board member for several government technology companies providing solutions to governments, and has previously served on federal advisory councils."}],"markDefs":[],"style":"normal"}],"fullName":"Brian Schimpf","image":{"_type":"imageWithMeta","asset":{"_id":"image-7f281eb14c6886917e8451d3b3c6c0263bde60c6-3000x3750-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":0.8,"height":3750,"width":3000},"hasAlpha":false,"isOpaque":true}}},"introduction":"Brian Schimpf is Co-Founder and Chief Executive Officer of Anduril Industries where he drives the strategic direction and product roadmap of the defense technology company.","metadata":null,"role":"Co-Founder and CEO","slug":{"_type":"slug","current":"brian-schimpf"}}],"category":"","date":"2026-05-13","excludeFromSearch":false,"image":{"_type":"imageWithMeta","asset":{"_id":"image-3fd07fbd243c71f684ce4bd486ae537f8755af85-3000x1688-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.7772511848341233,"height":1688,"width":3000},"hasAlpha":false,"isOpaque":true}}},"meta":{"_type":"meta","excludeLLM":false},"parent":{"_id":"cb940787-64b7-481d-8379-537ea6a1cf56","parent":null,"slug":{"_type":"slug","current":"news"},"title":"Newsroom"},"slices":[{"_key":"2b6714f64703","_type":"oneColumnRichText","arsenalPadding":false,"content":[{"_key":"d90630b45cbd","_type":"block","children":[{"_key":"50fa1dc4e733","_type":"span","marks":[],"text":"A Note from Brian Schimpf"}],"markDefs":[],"style":"h1"},{"_key":"82d43affcf4c","_type":"block","children":[{"_key":"ff53fcd26942","_type":"span","marks":[],"text":"Today, Anduril is announcing our Series H: a $5 billion raise which brings our valuation to $61 billion, led by Thrive Capital and Andreessen Horowitz.\n\nWhen we founded Anduril in 2017, defense was not a category that attracted significant venture investment. That has changed meaningfully over the last several years. Investors have increasingly recognized the scale of the technological and industrial challenges facing the United States and its allies. They are also observing an environment in which the most agile, adaptive, and ambitious companies are the ones most capable of solving these challenges.\n\nThis financing reflects that shift, and it gives us the ability to continue investing aggressively in manufacturing capacity, research and development, and the infrastructure required to build and field advanced defense systems at scale.\n\nBelow is a letter I shared with our investors in January outlining how we think about the changing character of conflict, the future of defense industrialization, and the role Anduril intends to play in both. Since it was written, US operations in Iran have reinforced many of the underlying dynamics described here particularly the importance of resilient production capacity, rapid adaptation, and the ability to sustain operations over extended periods of conflict.\n\nWe are publishing the letter publicly because these issues extend well beyond any one company, and because the ability to rapidly develop, produce, and sustain defense capability will matter greatly to the success of American and allied deterrence in the years ahead."}],"markDefs":[],"style":"normal"},{"_key":"d658c26617a2","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_id":"image-95f3082f5ffa24e1bb15ad36075cd49898bb7d76-466x234-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.9914529914529915,"height":234,"width":466},"hasAlpha":true,"isOpaque":true}},"crop":{"_type":"sanity.imageCrop","bottom":0.09429904619386272,"left":0.17964078876846118,"right":0.09661017895426405,"top":0},"hotspot":{"_type":"sanity.imageHotspot","height":0.6708784056048049,"width":0.6741774356836586,"x":0.5167295066102905,"y":0.45610266657100534}},"imageWidth":"20","style":"left"},{"_key":"b257e718aad2","_type":"block","children":[{"_key":"ac404ffbbc7e","_type":"span","marks":["em"],"text":"Brian Schimpf"},{"_key":"1af9f7dadfd3","_type":"span","marks":[],"text":"\n"},{"_key":"ff0b14abdb03","_type":"span","marks":["em"],"text":"Chief Executive Officer"},{"_key":"8c889998323c","_type":"span","marks":[],"text":"\n"},{"_key":"68c4cca33ffe","_type":"span","marks":["em"],"text":"Anduril Industries"}],"markDefs":[],"style":"normal"},{"_key":"74533d2f7361","_type":"block","children":[{"_key":"e743ae29d556","_type":"span","marks":[],"text":"Investor Letter, January 2026"}],"markDefs":[],"style":"h2"},{"_key":"78c611a25f41","_type":"block","children":[{"_key":"8e5bffa7e1db","_type":"span","marks":[],"text":"Building a defense company starts with a point of view. Not a vague sense of where the world might end up decades from now, but a concrete judgment about the kinds of conflicts that are most likely and what capabilities will actually matter when they come. This conviction quickly becomes necessary to guide a company’s choices — the hardest decisions are rarely about how to adjust to a world that is ten or fifteen years away. They’re about what to build over the next two to four years, when the picture is incomplete, tradeoffs are unavoidable, and capital has to be committed before outcomes are certain.\n\n2026 will mark Anduril’s ninth year. By many measures, we are still early in our company’s life. The average employee has been here less than two years. At the same time, the scale of the business has changed meaningfully. Over the past year, we more than doubled revenue (reaching $2.2B in 2025), nearly doubled our workforce, won and delivered on our first international program of record to the Royal Australian Navy, and demonstrated autonomous flight on an Air Force unmanned combat aircraft program, among many other milestones. We transitioned more than double the number of developmental systems into production at scale than we had previously.\n\nThis letter is about the assumptions underlying our strategy: how we see the technology and geopolitical environment evolving, and how that view is shaping the products, factories, and software platforms we’re investing in now."}],"markDefs":[],"style":"normal"},{"_key":"cc07ca7bdb8d","_type":"block","children":[{"_key":"d3b5f5c77ef1","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"304509facdb0","_type":"block","children":[{"_key":"21bdbf0eb29c","_type":"span","marks":["strong"],"text":"01: Technology, Geopolitics, and the Return of Industrial Warfare"}],"markDefs":[],"style":"normal"},{"_key":"847bb44699ea","_type":"block","children":[{"_key":"72b15ee50322","_type":"span","marks":[],"text":"From our vantage point, the defining feature of the current moment is the convergence of two forces: rapid technological change and intensifying great-power competition. Together, they place a premium on speed of decision-making and of adaptation. History shows that these convergences create some of the most volatile and consequential periods. An appreciation of both transitions is essential to understanding what must be built.\n\n"},{"_key":"21a941ef6923","_type":"span","marks":["em"],"text":"The Technological Transformation"},{"_key":"f5cd444a4d2e","_type":"span","marks":[],"text":"\nThe convergence of artificial intelligence, autonomy, and advanced sensing is reshaping warfare. We are entering an era where mass will again determine the victor, but intelligent, networked mass, not the industrial-age attrition of previous centuries. Three technological changes are driving this shift:"}],"markDefs":[],"style":"normal"},{"_key":"171102032944","_type":"block","children":[{"_key":"9c3050408e8e","_type":"span","marks":["strong"],"text":"Autonomy and AI enable scale previously impossible. "},{"_key":"5060539628e0","_type":"span","marks":[],"text":"Advanced software allows even resource-constrained forces to control far more platforms than previously possible. Recent analysis suggests that improvements in autonomy will enable swarms far more powerful than any individual platform, with employment driven at costs once thought unimaginably low."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"7955f5b2bf37","_type":"block","children":[{"_key":"4e2a19d6cd44","_type":"span","marks":["strong"],"text":"Pervasive sensing makes concealment nearly impossible in most domains."},{"_key":"0ae4cf5aaa46","_type":"span","marks":[],"text":" Advances in sensor technology allow militaries to detect activity across air, ground, and surface domains with unprecedented fidelity. Under such conditions, superior mass becomes decisive, and the rare domains where sensing remains difficult, like the deep sea, become disproportionately important."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"77d90e565da0","_type":"block","children":[{"_key":"a2ef07fa617f","_type":"span","marks":["strong"],"text":"Long-range strike is increasingly democratized."},{"_key":"4546c0225ccc","_type":"span","marks":[],"text":" Adversaries have more access to deep strike capability than ever. Inexpensive drones and missiles are reshaping how forces can hold assets under threat, with lines of contact extending far beyond visual range. Nations will need many well-dispersed and easily replicated effectors to respond."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"f68bbb56c87a","_type":"block","children":[{"_key":"4b032520badd","_type":"span","marks":[],"text":"\n"},{"_key":"0640d3c04cdf","_type":"span","marks":["em"],"text":"The Geopolitical Transformation"},{"_key":"91ad16c0e51c","_type":"span","marks":[],"text":"\nAt the same time, we have entered a new Cold War period. China's formidable buildup of hard power and growing intent to wield it, coupled with the United States prioritizing hemispheric defense, means allies must shoulder greater responsibility for regional deterrence. Under the logic of great power rivalry, conflicts will be regional and bifurcated, alliance structures will shift, and rearmament is not optional. Withstanding techno-military competition will require rapid means to reconstitute combat power in short periods of time. As in the first Cold War, the U.S.-China relationship will likely proceed through a framework of containment and managed competition in which both sides maintain common rules while avoiding open conflict.\n\nFor Anduril, the convergence of these trends changes the calculus. The historian Paul Kennedy observes that periods featuring both technological disruption and geopolitical instability have been particularly volatile, especially when new technologies confer advantages to aggressors. Late-1870s to early 20th century Europe offers an instructive parallel: a rising Germany underwent an industrial renaissance and harnessed that progress for a rapid military buildup. Multiple technological advances arrived simultaneously. The period ended in global conflict, with victory accruing to the combined allied production engine but only after catastrophic losses.\n\nThe lesson is not that conflict is inevitable, but that industrial and technological superiority must be maintained to preserve deterrence. In periods of convergence, the side that adapts fastest shapes the terms of competition - and specifically, victory will go to the side that can most quickly translate technological advancement into deployable military capability at scale. Multiple defense assessments identify 2027 as a window of maximum danger with China, a period when Beijing may assess it has sufficient capability and opportunity to act. We are now fast approaching that window. The convergence of technological possibility and geopolitical instability is the defining strategic reality of our time."}],"markDefs":[],"style":"normal"},{"_key":"a8998c23825b","_type":"block","children":[{"_key":"026a52538719","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"4ccd2058907c","_type":"block","children":[{"_key":"24fa7aa18077","_type":"span","marks":["strong"],"text":"02: A Defense Industrial Base Built for a Different War"}],"markDefs":[],"style":"normal"},{"_key":"0ca40bd30940","_type":"block","children":[{"_key":"afa7899ef901","_type":"span","marks":[],"text":"This dynamic strategic environment demands rapid adaptation. But the defense industrial base that must respond to these challenges was designed for fundamentally different conditions. Built to sustain Cold War-era force structures through incremental modernization, the current system was optimized for low-rate production of exquisite platforms over multi-decade timelines. That model made sense when threats evolved slowly and technological superiority could be maintained through small numbers of highly capable systems. It does not make sense today.\n\nThe consolidation and offshoring of the 1990s and 2000s decimated the domestic supplier base, eliminating redundancy and excess capacity in favor of efficiency. Lead times for missiles, ships, and aircraft now stretch across years. Production rates are measured in dozens or hundreds per year, not thousands. The system was built for steady-state sustainment, not surge or mobilization. When conflicts demand magazine depth—when combatants burn through precision munitions in weeks rather than years—any difficulty scaling production becomes a strategic vulnerability.\n\nThe gap between what the moment requires and what the industrial base can deliver is stark. Future conflicts will absolutely require the highest-end, most exquisite capabilities, but only as part of a high-low mix, where the low end is enabled by high-rate production that can scale rapidly. These systems will require shorter design-to-fielding timelines measured in months and years, not decades. They will need modular, software-defined systems that can be updated and improved continuously, not locked into configurations for thirty-year service lives. They will depend on manufacturing infrastructure capable of wartime production volumes and a supplier base with genuine redundancy and resilience.\n\nClosing this gap requires a different model. The defense industry must shift from exquisite platforms toward intelligent mass—a mix of high-end and scalable systems that combine precision with producibility. We must embrace commercial manufacturing techniques, automation, and modern production methods that enable both quality and scale. We must treat production capacity itself as a strategic asset, not an afterthought. And it must prioritize software-defined architectures that enable rapid iteration and improvement without requiring complete platform replacement.\n\nThis is not a critique of any particular company or program. It is a recognition that the system was built for conditions that no longer exist. The White House's National Security Strategy acknowledges this reality explicitly: in the words of that document, we need to buy large numbers of things in very short periods of time. Secretary Hegseth put it more bluntly, “We're done running a peacetime science fair while our adversaries are running a wartime arms race.\" A realistic and actionable national defense policy must be synonymous with national industrial policy - and a history of outsourcing production overseas has led to material deficiencies in our ability to ramp production when needed. The question is not whether transformation is necessary. It is who will lead it—and whether that transformation happens fast enough to matter."}],"markDefs":[],"style":"normal"},{"_key":"8970a0d9b10b","_type":"block","children":[{"_key":"1938fdba6426","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"97b7445091eb","_type":"block","children":[{"_key":"6bff495e844a","_type":"span","marks":["strong"],"text":"03: What we’ll build."}],"markDefs":[],"style":"normal"},{"_key":"f69a54c8d3c6","_type":"block","children":[{"_key":"e49ea577b6c5","_type":"span","marks":[],"text":"Future conflicts will be decided by the ability to generate targeting faster, deliver effects at range in volume, and deny the same to our adversaries. Advantage will belong to the force that can coordinate sensors and effectors at scale while preserving combat power under sustained attack. Everything we build at Anduril is organized around these problems.\n\nOn the offensive side, our focus is on range, mass, and coordination. Autonomous systems are an enabler—not the objective. They allow sensors and effectors to be placed where they matter, in greater numbers and with greater persistence than centralized approaches permit. The decisive factor is the ability to deliver credible effects across multiple vectors and price points, faster than an adversary can respond or reconstitute.\n\nStrike effectiveness is governed by targeting speed and quality. We are investing in software-enabled targeting systems that fuse sensing, automation, and artificial intelligence to compress the time between detection and effect. These systems are designed for environments where communications are contested and centralized control is fragile. Distributed, node-centric architectures—capable of operating with partial connectivity—are the baseline condition, not an edge case.\n\nAs we build these capabilities for allied forces, we are equally focused on confounding an adversary’s ability to target and strike effectively. Counter-targeting, through deception, dispersion, electronic warfare, and resilience, is inseparable from survivability. At the same time, defensive protection—exemplified through integrated air defense and counter-drone systems—is now foundational. Recent conflicts have shown that static defenses and bespoke point solutions fail when faced with volume. Preserving combat power requires layered, modular systems designed to defeat large numbers of diverse threats at scale, while forcing the adversary to expend disproportionate resources to achieve marginal effects.\n\nThe common requirement across all of this is coordination. Strike, targeting, survivability, and counter-targeting only matter if they operate as a system. That is why Lattice is foundational to everything we build. Modern warfare demands a distributed, software-defined system for sensing, targeting, and strike that integrates sensors, effectors, defensive systems, and autonomous platforms across domains and time horizons. Lattice provides the command-and-control backbone that allows those systems to operate as a coherent whole allocating force dynamically, adapting to disruption, and accelerating decision-making across the battlespace.\n\nAcross offense and defense alike, producibility and software-defined evolution are foundational requirements. Systems must be designed from the outset to be manufactured in quantity, fielded rapidly, and upgraded continuously in theater. Hardware cannot be frozen at deployment. Software cannot be locked into multi-decade refresh cycles. Production capacity, upgrade velocity, and supply-chain resilience are core elements of system design, not downstream considerations.\n\nThis is the unifying logic of our portfolio. Platforms extend reach and mass. Sensors and software create targeting advantage. Defensive and counter-targeting systems preserve survivability. Lattice binds them together. All of it is designed for speed, scale, and adaptation.\n\nTime is the constraint. With the period of elevated risk approaching, we are prioritizing systems that can be fielded, produced, and evolved on timelines that matter."}],"markDefs":[],"style":"normal"},{"_key":"8d3d977c9574","_type":"block","children":[{"_key":"a503e2bf2f5d","_type":"span","marks":[],"text":""}],"markDefs":[],"style":"normal"},{"_key":"bcb5ec5b920c","_type":"block","children":[{"_key":"a3dc9a7f6b45","_type":"span","marks":["strong"],"text":"04: Conclusion"}],"markDefs":[],"style":"normal"},{"_key":"8bd9bdc07152","_type":"block","children":[{"_key":"18edaee89a59","_type":"span","marks":[],"text":"Despite the challenges we’ve outlined, there is reason for optimism: in our new world, the victors will be those who are best suited to deliver mass and apply advanced technologies to their future force. We are singularly positioned to build at scale, deploy superior software, and act with the speed that our status as a technology company affords us. Our leadership is prepared to make big bets on how to influence the future battlespace that industry peers simply cannot.\n\nWe’re already working across each of these verticals:"}],"markDefs":[],"style":"normal"},{"_key":"a84d0206c8a3","_type":"block","children":[{"_key":"6832ba42398b","_type":"span","marks":["strong"],"text":"Platforms that extend reach and mass: "},{"_key":"b96df2905fd3","_type":"span","marks":[],"text":"We increasingly are considered the go-to partner for the government’s development of unmanned platforms. We flew Fury for the Air Force’s Collaborative Combat Aircraft in October 2025, and have seen wins for our undersea and small drones programs across the US and internationally. We’ve continued apace in our testing of various form factors of missile technology, including our Barracuda family of systems, as we optimize them for mass production. At the highest level, Anduril will continue to build for a world where effects salvos are large in number and wide in variance."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"1bb6854a1ac5","_type":"block","children":[{"_key":"2c4dc6fbf3bb","_type":"span","marks":["strong"],"text":"Sensors and software which create targeting advantage:"},{"_key":"fbcca2524646","_type":"span","marks":[],"text":" Within our Connected Warfare division and software platform, we have shipped command-and-control technologies through programs like the Army’s Next Generation Command and Control (NGC2) that will boost soldier lethality rapidly. We’ve already seen major wins such as the Army’s Integrated Battle Command System - Maneuver (IBCS-M) that showcase our leadership in the capacity to integrate, fuse, and pair weapon systems, especially in contested environments."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"c52242044ce4","_type":"block","children":[{"_key":"672a1e621389","_type":"span","marks":["strong"],"text":"Defense and counter targeting to preserve survivability, in conjunction with Lattice:"},{"_key":"74b41b5bb4c9","_type":"span","marks":[],"text":" Anduril’s layered, networked battle management system and associated effectors have set the industry standard in air defense for several years. We’ll continue to set the pace across administration priorities like counter-drone — and remain focused on enabling resiliency that will be determinative in a grinding contest of mass."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"4e094ba1e4e4","_type":"block","children":[{"_key":"bc24ebbcae45","_type":"span","marks":["strong"],"text":"Mass producibility that spans all of these verticals:"},{"_key":"5148b5e400c7","_type":"span","marks":[],"text":" Anduril will be at the center of the current national mobilization effort. Our Arsenal-1 factory will achieve high-rate production in this upcoming year, and our focus is squarely on building ArsenalOS and the tools which will give us unparalleled ability to scale throughput at that facility and others like it. This philosophy is completely in line with the administration’s recent executive order encouraging the deployment of capital toward production capacity rather than buybacks - we hope other defense contractors take notice."}],"level":1,"listItem":"bullet","markDefs":[],"style":"normal"},{"_key":"6373a888d2f0","_type":"block","children":[{"_key":"fa7d0c2fb3d0","_type":"span","marks":[],"text":"\nAs we look to the coming year, we remain focused on delivering the arsenal that keeps the United States and its allies out of the fight by preparing for it. We will look forward to your collective support and participation: for our sake, but for the sake of the nation as well.\n\n"},{"_key":"a83bdc24a7db","_type":"span","marks":["strong"],"text":"SIGNED:"}],"markDefs":[],"style":"normal"},{"_key":"8787f6602ca5","_type":"richTextImage","image":{"_type":"imageWithMeta","asset":{"_id":"image-95f3082f5ffa24e1bb15ad36075cd49898bb7d76-466x234-png","_type":"sanity.imageAsset","mimeType":"image/png","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":1.9914529914529915,"height":234,"width":466},"hasAlpha":true,"isOpaque":true}},"crop":{"_type":"sanity.imageCrop","bottom":0,"left":0.20638622558361125,"right":0.19621062112910911,"top":0},"hotspot":{"_type":"sanity.imageHotspot","height":1,"width":0.5974031532872796,"x":0.5050878022272511,"y":0.5}},"imageWidth":"20","style":"left"},{"_key":"58e5ae510c6f","_type":"block","children":[{"_key":"c7e12ec0dc5b","_type":"span","marks":["em"],"text":"Brian Schimpf\nChief Executive Officer\nAnduril Industries"}],"markDefs":[],"style":"normal"}],"fullBleed":false,"paragraphWidth":"w-100"}],"slug":{"_type":"slug","current":"anduril-announces-usd5b-series-h-raise"},"title":"Anduril Announces $5B Series H Raise","viewType":"main","path":"news/anduril-announces-usd5b-series-h-raise"}
