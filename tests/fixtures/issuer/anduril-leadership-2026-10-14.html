        {"_createdAt":"2025-04-11T14:41:05Z","_id":"d507a0a3-b913-4639-b6d1-45ba32ad3c7c","_rev":"A4cDSaj9FJWJ0kVvSkZL1R","_system":{"base":{"id":"d507a0a3-b913-4639-b6d1-45ba32ad3c7c","rev":"I3Ef5RIrs4lB0Q3ZbzVI2e"}},"_type":"page","_updatedAt":"2026-09-28T15:08:49Z","category":"company","meta":{"description":"Meet the leadership team driving Anduril's mission to transform defense technology through autonomous systems and advanced AI.","title":"Anduril Leadership"},"parent":null,"slices":[{"_key":"4965bc95b2be","_type":"navColorSlice","navColorMode":"dark"},{"_key":"60231509daaa","_type":"pageHero","backgroundColor":{"_createdAt":"2025-03-28T19:58:46Z","_id":"d2fa5ff3-9533-4568-8a11-b0df29ce9962","_rev":"x8r7rwnZNJLuzU8uziac7x","_system":{"base":{"id":"d2fa5ff3-9533-4568-8a11-b0df29ce9962","rev":"3h6Aq9HwJKloB0447GtDIQ"}},"_type":"color","_updatedAt":"2025-06-18T01:04:31Z","contrastColor":"#010101","hex":"#B0B0A9","metadata":null,"name":"Medium Gray"},"shortTitle":"Anduril","title":"Leadership"},{"_key":"e741ad6bfc32","_type":"peopleSlice","profiles":[{"_key":"337a9ab4a630","_type":"profile","person":{"_createdAt":"2025-04-10T02:38:50Z","_id":"90faea4d-b1a9-4bba-a495-458dfdb4af83","_rev":"vF70CHcCgVKNA9cU1sRvSM","_system":{"base":{"id":"90faea4d-b1a9-4bba-a495-458dfdb4af83","rev":"xkp7TRHt1f3meW5z5V4b2N"}},"_type":"person","_updatedAt":"2025-11-18T17:34:22Z","bio":[{"_key":"acb481c38bd2","_type":"block","children":[{"_key":"fc25c8d51887","_type":"span","marks":[],"text":"Palmer founded Anduril Industries in 2017 to radically transform the defense capabilities of the United States and its allies by fusing artificial intelligence with the latest hardware advancements. At Anduril, Palmer integrates a consumer technology business model with mission-driven objectives, enabling rapid product development and deployment, setting the company apart from other players in the defense industry."}],"markDefs":[],"style":"normal"},{"_key":"3ed3bcb24cbb","_type":"block","children":[{"_key":"3f06d4e74ae0","_type":"span","marks":[],"text":"His deep interest in defense technology was driven by his time at the USC ICT MxR lab, where he built hardware used to research immersive PTSD treatment for US veterans. He continued to support various military applications of VR during his time at Oculus, informing his belief that radical modernization of US military technology is a prerequisite for preserving our way of life."}],"markDefs":[],"style":"normal"},{"_key":"12e53234b628","_type":"block","children":[{"_key":"078d0ab70fee","_type":"span","marks":[],"text":"Palmer began attending Golden West College and Long Beach City College at the age of 14, and studied at California State University, Long Beach before dropping out to build Oculus VR."}],"markDefs":[],"style":"normal"}],"fullName":"Palmer Luckey","image":{"_type":"imageWithMeta","asset":{"_id":"image-d17177917120673235d3dcfd740365b32c77ce34-3000x3750-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":0.8,"height":3750,"width":3000},"hasAlpha":false,"isOpaque":true}}},"introduction":"Palmer Luckey is an American inventor, innovator, and entrepreneur. He is the Founder of defense technology company Anduril Industries, designer of the Oculus Rift.","metadata":null,"role":"Founder","slug":{"_type":"slug","current":"palmer-luckey"}}},{"_key":"b521ab50e577","_type":"profile","person":{"_createdAt":"2025-04-10T02:38:50Z","_id":"1e8357b7-66a6-46c2-9dab-032bfee81bcc","_rev":"vF70CHcCgVKNA9cU1sRvhW","_system":{"base":{"id":"1e8357b7-66a6-46c2-9dab-032bfee81bcc","rev":"xkp7TRHt1f3meW5z5V4kVK"}},"_type":"person","_updatedAt":"2025-11-18T17:34:39Z","bio":[{"_key":"dea7c34ef13c","_type":"block","children":[{"_key":"bce8f78f35200","_type":"span","marks":[],"text":"Prior to Anduril, Brian was an early hire at Palantir Technologies, where he built the Foundry product that is now deployed worldwide, and led the engineering and product organizations as Director of Engineering. He served numerous domestic and international government organizations across the intelligence, defense, and law enforcement sectors."}],"markDefs":[],"style":"normal"},{"_key":"fe0584ce591f","_type":"block","children":[{"_key":"1fff867709b1","_type":"span","marks":[],"text":"Previously, Brian was the Founder and Lead of Cornell University’s autonomous vehicle research program where his teams competed in the DARPA Grand Challenge and Urban Challenge. Based on this work, he published several technical papers on autonomous vehicles. Brian graduated from Cornell University with a Bachelor of Science in Operations Research and Industrial Engineering. He also serves as a senior advisor and board member for several government technology companies providing solutions to governments, and has previously served on federal advisory councils."}],"markDefs":[],"style":"normal"}],"fullName":"Brian Schimpf","image":{"_type":"imageWithMeta","asset":{"_id":"image-7f281eb14c6886917e8451d3b3c6c0263bde60c6-3000x3750-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":0.8,"height":3750,"width":3000},"hasAlpha":false,"isOpaque":true}}},"introduction":"Brian Schimpf is Co-Founder and Chief Executive Officer of Anduril Industries where he drives the strategic direction and product roadmap of the defense technology company.","metadata":null,"role":"Co-Founder and CEO","slug":{"_type":"slug","current":"brian-schimpf"}}},{"_key":"27a53453fc5c","_type":"profile","person":{"_createdAt":"2025-04-10T02:38:50Z","_id":"67d3b345-dc9a-47a7-a5ac-c46c0262adf8","_rev":"cxYZiU7Nl5zdkSk2OHRJmx","_system":{"base":{"id":"67d3b345-dc9a-47a7-a5ac-c46c0262adf8","rev":"K8b26JzGBRMw82C84BRmey"}},"_type":"person","_updatedAt":"2025-11-18T17:34:32Z","bio":[{"_key":"7cb3919d0ad8","_type":"block","children":[{"_key":"3aaab7a0ce550","_type":"span","marks":[],"text":"Previously, Trae was an early employee at Palantir Technologies, where he led teams focused on growth in the intelligence and defense sector as well as international expansion, helping large organizations solve their hardest data analysis problems. He was also an integral part of the product team, leading the design and strategy for new product offerings. While at Palantir, Trae also served as an adjunct faculty member at Georgetown University.\n\nBefore joining Palantir, Trae worked as a computational linguist building enterprise solutions to Arabic/Persian name matching and data enrichment within the U.S. Intelligence Community. He began his career working in the office of then Congressman Rob Portman and in the Political Affairs Office at the Embassy of Afghanistan in Washington, D.C. immediately following the installation of Hamid Karzai’s transitional government. Trae graduated from the School of Foreign Service at Georgetown University."}],"markDefs":[],"style":"normal"}],"fullName":"Trae Stephens","image":{"_type":"imageWithMeta","asset":{"_id":"image-87e37cb13f3830f3975611cec8bccb81e1fda82b-6336x7920-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":0.8,"height":7920,"width":6336},"hasAlpha":false,"isOpaque":true}}},"introduction":"Trae Stephens is Co-founder and Executive Chairman of Anduril Industries, a defense technology company, and a General Partner at venture capital firm Founders Fund, where he invests across sectors with a particular interest in startups operating in the government space.","metadata":null,"role":"Co-Founder & Executive Chairman","slug":{"_type":"slug","current":"trae-stephens"}}},{"_key":"391cfe8fb867","_type":"profile","person":{"_createdAt":"2025-04-10T02:38:50Z","_id":"d7c9b5ca-7cfa-4b9e-805e-27650cb02fa5","_rev":"vF70CHcCgVKNA9cU1sRvp6","_system":{"base":{"id":"d7c9b5ca-7cfa-4b9e-805e-27650cb02fa5","rev":"mEYHpcOTH7fOaiYuCW6FR4"}},"_type":"person","_updatedAt":"2025-11-18T17:34:46Z","bio":[{"_key":"ae29fea108e1","_type":"block","children":[{"_key":"9dd4fef41fd00","_type":"span","marks":[],"text":"Prior to Anduril, Matt was a Principal at Mithril Capital Management where he invested in growth-stage companies. Previously, Matt was an early hire at Palantir, where he worked in both operational and technical roles. At Palantir, Matt deployed to both Iraq and Afghanistan to ensure U.S. forces had the best technology for the mission. Prior to Palantir, Matt was a consultant for Booz Allen Hamilton where he advised the Defense Intelligence Agency and the U.S. Navy.\n\nWhile classmates at Cornell University, Matt co-founded with Brian Schimpf the university's autonomous vehicle entry into the DARPA Grand Challenge and Urban Challenge competitions. He graduated from Cornell with both a Bachelor of Science in Mechanical and Aerospace Engineering and a Master of Engineering in Systems Engineering."}],"markDefs":[],"style":"normal"}],"fullName":"Matt Grimm","image":{"_type":"imageWithMeta","asset":{"_id":"image-800c93b6f3b822675aae20ee0384951d68b0d77d-5982x7478-jpg","_type":"sanity.imageAsset","mimeType":"image/jpeg","metadata":{"_type":"sanity.imageMetadata","dimensions":{"_type":"sanity.imageDimensions","aspectRatio":0.7999465097619685,"height":7478,"width":5982},"hasAlpha":false,"isOpaque":true}}},"introduction":"Matt Grimm is Co-Founder and Chief Operating Officer of Anduril Industries where he oversees all global business operations, including procurement, manufacturing and supply chain initiatives, facilities and security, people management and finance.","metadata":null,"role":"Co-Founder & COO","slug":{"_type":"slug","current":"matt-grimm"}}}]}],"slug":{"_type":"slug","current":"anduril-leadership"},"title":"Anduril Leadership","path":"anduril-leadership"}
